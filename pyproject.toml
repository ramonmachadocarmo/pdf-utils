[tool.poetry]
name = "pdf-utils"
version = "1.1.0"
description = "PDF reader, editor and converter (PNG, JPEG, WEBP, DOCX)"
authors = ["Ramon"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0" }
python-multipart = ">=0.0.12"
pymupdf = ">=1.24.0"
pdf2docx = ">=0.5.8"
pillow = ">=10.4.0"
pywebview = ">=6.2.1"
pythonnet = { version = ">=3.1.0", markers = "sys_platform == 'win32'" }
defusedxml = "^0.7.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"
pytest-cov = "^7.1.0"
pyinstaller = "^6.22.1"

[tool.coverage.run]
omit = ["app/desktop.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=95"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
