[tool.poetry]
name = "pdf-utils"
version = "1.0.0"
description = "PDF reader, ink editor and converter (PNG, JPEG, WEBP, DOCX)"
authors = ["Ramon"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0" }
python-multipart = ">=0.0.12"
pymupdf = ">=1.24.0"
pdf2docx = ">=0.5.8"
pillow = ">=10.4.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
