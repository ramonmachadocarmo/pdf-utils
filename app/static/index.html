<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Utils</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <header class="brand chrome">
      <div class="brand-row">
        <p class="mark">PDF Utils</p>
        <label class="lang-field">
          <span data-i18n="lang.label">Language</span>
          <select id="lang-select" aria-label="Language">
            <option value="en">English</option>
            <option value="pt-BR">Portugues (BR)</option>
            <option value="es">Espanol</option>
          </select>
        </label>
      </div>
      <h1 data-i18n="home.headline">Read. Edit. Convert.</h1>
      <p class="lede" data-i18n="home.lede">Zoom, search, text, highlight, stamp and signature — all local.</p>
      <a class="update-banner" id="update-banner" href="#" target="_blank" rel="noopener" hidden>
        <span data-i18n="update.available">Update available</span>
        <span id="update-version"></span>
      </a>
    </header>

    <section class="workspace" data-i18n-aria="a11y.editor" aria-label="Editor">
      <div class="drop-row" id="drop-row">
        <label class="drop chrome" id="dropzone" for="file-input">
          <input id="file-input" type="file" accept="application/pdf,.pdf,application/xml,text/xml,.xml" hidden />
          <span class="drop-title" data-i18n="drop.title">Drop your PDF here</span>
          <span class="drop-sub" data-i18n="drop.sub">or click to choose a file</span>
        </label>
        <button type="button" class="ghost merge-btn chrome" id="merge-btn" data-i18n="merge.btn">Concatenate PDFs</button>
        <input id="merge-input" type="file" accept="application/pdf,.pdf" multiple hidden />
      </div>

      <div class="panel" id="panel" hidden>
        <div class="top-chrome chrome">
          <div class="meta">
            <div>
              <p class="meta-label" data-i18n="meta.file">File</p>
              <p class="meta-value" id="file-name">—</p>
            </div>
            <div>
              <p class="meta-label" data-i18n="meta.pages">Pages</p>
              <p class="meta-value" id="page-count">—</p>
            </div>
          </div>
          <form id="convert-form" class="controls">
            <label>
              <span data-i18n="convert.format">Format</span>
              <select name="format" id="format">
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="webp">WEBP</option>
                <option value="docx">DOCX</option>
              </select>
            </label>
            <label id="dpi-field">
              DPI
              <input type="number" name="dpi" id="dpi" min="72" max="600" value="150" />
            </label>
            <label id="quality-field">
              <span data-i18n="convert.quality">Quality</span>
              <input type="number" name="quality" id="quality" min="1" max="100" value="90" />
            </label>
            <button type="submit" class="cta" id="convert-btn" data-i18n="convert.submit">Convert</button>
          </form>
        </div>
        <p class="status chrome" id="status" role="status"></p>

        <div class="toolbar chrome" id="toolbar">
          <div class="tool-group" role="toolbar" data-i18n-aria="a11y.tools" aria-label="Tools">
            <button type="button" class="tool active" data-tool="pen" data-i18n="tool.pen">Pen</button>
            <button type="button" class="tool" data-tool="highlight" data-i18n="tool.highlight">Highlight</button>
            <button type="button" class="tool" data-tool="text" data-i18n="tool.text">Text</button>
            <button type="button" class="tool" data-tool="signature" data-i18n="tool.signature">Signature</button>
            <div class="stamp-cluster" id="stamp-cluster">
              <button type="button" class="tool" data-tool="stamp" data-i18n="tool.stamp">Stamp</button>
              <select id="stamp-kind" data-i18n-aria="stamp.kind" aria-label="Stamp type">
                <option value="approved" data-i18n="stamp.approved">Approved</option>
                <option value="paid" data-i18n="stamp.paid">Paid</option>
                <option value="date" data-i18n="stamp.date">Date</option>
              </select>
            </div>
            <button type="button" class="tool" data-tool="pan" data-i18n="tool.pan">Hand</button>
          </div>
          <label class="tool-field">
            <span data-i18n="tool.color">Color</span>
            <input type="color" id="pen-color" value="#c0392b" />
          </label>
          <label class="tool-field grow">
            <span data-i18n="tool.width">Width</span>
            <input type="range" id="pen-width" min="1" max="14" value="3" />
          </label>
          <button type="button" class="ghost" id="undo-stroke" data-i18n="edit.undo">Undo</button>
          <button type="button" class="ghost" id="clear-strokes" data-i18n="edit.clear">Clear</button>
          <button type="button" class="cta" id="save-ink" data-i18n="edit.save">Save edits</button>
          <button type="button" class="ghost" id="download-pdf" data-i18n="edit.download">Download PDF</button>
        </div>

        <div class="focus-bar" id="focus-bar" hidden>
          <button type="button" class="cta" id="focus-exit" data-i18n="focus.show_ui">Show UI</button>
          <button type="button" class="ghost" id="focus-prev">‹</button>
          <span class="page-chip"><span id="page-current-focus">1</span> / <span id="page-total-focus">1</span></span>
          <button type="button" class="ghost" id="focus-next">›</button>
          <button type="button" class="ghost icon-btn" id="focus-zoom-out">−</button>
          <span class="zoom-label" id="focus-zoom-label">100%</span>
          <button type="button" class="ghost icon-btn" id="focus-zoom-in">+</button>
        </div>

        <div class="editor-layout">
          <aside class="thumbs" id="thumbs" data-i18n-aria="a11y.thumbs" aria-label="Thumbnails"></aside>
          <div class="preview-wrap">
            <div class="viewport" id="viewport">
              <div class="pages" id="pages"></div>
              <button type="button" class="nav nav-prev" id="prev-page" data-i18n-aria="a11y.page_prev" aria-label="Previous page">‹</button>
              <button type="button" class="nav nav-next" id="next-page" data-i18n-aria="a11y.page_next" aria-label="Next page">›</button>
              <p class="page-chip overlay chrome"><span id="page-current">1</span> / <span id="page-total">1</span></p>
            </div>
          </div>
        </div>

        <div class="reader-bar chrome" id="reader-bar">
          <label class="tool-field grow">
            <span data-i18n="search.label">Search</span>
            <input type="search" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="text in PDF" />
          </label>
          <button type="button" class="ghost" id="search-btn" data-i18n="search.btn">Search</button>
          <button type="button" class="ghost" id="search-prev" data-i18n="search.prev">Previous</button>
          <button type="button" class="ghost" id="search-next" data-i18n="search.next">Next</button>
          <span class="search-count" id="search-count">0</span>
          <div class="zoom-cluster">
            <button type="button" class="ghost icon-btn" id="zoom-out" data-i18n-aria="zoom.out" aria-label="Zoom out">−</button>
            <span class="zoom-label" id="zoom-label">100%</span>
            <button type="button" class="ghost icon-btn" id="zoom-in" data-i18n-aria="zoom.in" aria-label="Zoom in">+</button>
          </div>
          <button type="button" class="ghost" id="rotate-btn" data-i18n="reader.rotate">Rotate 90°</button>
          <button type="button" class="ghost" id="copy-text-btn" data-i18n="reader.copy_text">Copy text</button>
          <div class="print-cluster">
            <label class="tool-field" data-i18n-aria="print.from" aria-label="From page">
              <span data-i18n="print.from">From</span>
              <input type="number" id="print-from" min="1" value="1" />
            </label>
            <label class="tool-field" data-i18n-aria="print.to" aria-label="To page">
              <span data-i18n="print.to">To</span>
              <input type="number" id="print-to" min="1" value="1" />
            </label>
            <button type="button" class="ghost" id="print-btn" data-i18n="reader.print">Print</button>
          </div>
          <button type="button" class="ghost" id="night-btn" data-i18n="reader.night">Night</button>
          <button type="button" class="ghost" id="focus-btn" data-i18n="reader.focus">Focus view</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="merge-modal" hidden>
    <div class="modal chrome">
      <h2 data-i18n="merge.pick_title">Choose a page size</h2>
      <p class="lede" data-i18n="merge.pick_sub">Your files have different page sizes. Pick one — the rest will be resized to fit.</p>
      <div class="merge-size-list" id="merge-size-list"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="merge-cancel" data-i18n="merge.cancel">Cancel</button>
        <button type="button" class="cta" id="merge-confirm" data-i18n="merge.confirm">Merge</button>
      </div>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="/static/editor.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
